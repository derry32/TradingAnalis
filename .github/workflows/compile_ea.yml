name: Compile MT5 EA

on:
  push:
    paths:
      - 'mt5/**'
      - '.github/workflows/compile_ea.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5 and Compile EA
        shell: powershell
        run: |
          Write-Host "=== Downloading MetaTrader 5 Setup ==="
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          
          Write-Host "=== Installing MetaTrader 5 silently ==="
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto /portable" -Wait
          
          $editorPath = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          if (-not (Test-Path $editorPath)) {
            $editorPath = "$env:LOCALAPPDATA\Programs\MetaTrader 5\metaeditor64.exe"
          }
          Write-Host "Found MetaEditor at: $editorPath"
          
          $mq5Path = Join-Path $PWD "mt5\AurumAI_Executor.mq5"
          $logPath = Join-Path $PWD "compile.log"
          $incPath = "C:\Program Files\MetaTrader 5\MQL5"
          
          Write-Host "=== Compiling $mq5Path ==="
          & "$editorPath" /compile:"$mq5Path" /include:"$incPath" /log:"$logPath"
          Start-Sleep -Seconds 5
          
          if (Test-Path $logPath) {
            Get-Content -Path $logPath -Encoding Unicode
          }
          
          $ex5Path = Join-Path $PWD "mt5\AurumAI_Executor.ex5"
          if (Test-Path $ex5Path) {
            Write-Host "SUCCESS: $ex5Path was generated!"
          } else {
            Write-Host "Trying without /include..."
            & "$editorPath" /compile:"$mq5Path" /log:"$logPath"
            Start-Sleep -Seconds 5
            if (Test-Path $logPath) {
              Get-Content -Path $logPath -Encoding Unicode
            }
          }

      - name: Upload compiled .ex5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumAI_Executor
          path: mt5/AurumAI_Executor.ex5

      - name: Commit and push compiled .ex5
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mt5/AurumAI_Executor.ex5
          git commit -m "Auto-compile AurumAI_Executor.ex5 [skip ci]" || exit 0
          git push
